<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="{{favicon}}">
<title>{{t.titulo}} · {{nome}}</title>
<!--
  Página de login própria, fora do bundle protegido. Autossuficiente de
  propósito: tudo em /assets/ está atrás do login, então as fontes vêm de
  /fontes/ (copiadas dos pacotes @fontsource no build, pelo plugin) e os
  tokens de cor estão duplicados aqui. tests/tokens.test.js
  confere que cada cor abaixo existe em src/styles/tokens.css.
-->
<style>
  @font-face { font-family: 'Unbounded'; font-weight: 900; font-display: swap; src: url('/fontes/unbounded-900.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url('/fontes/inter-400.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; font-display: swap; src: url('/fontes/inter-600.woff2') format('woff2'); }
  :root {
    color-scheme: dark;
    --surface-0: #000000; --surface-1: #1a1a1a; --surface-2: #262626;
    --text-primary: #ffffff; --text-secondary: #e5e5e5; --text-disabled: #6b6b6b;
    --border: #3a3a3a; --border-strong: #ffffff;
    --primary: #ffffff; --primary-ink: #000000; --primary-hover: #e5e5e5; --primary-active: #cccccc;
    --focus: #ffffff;
  }
  html.theme-light {
    color-scheme: light;
    --surface-0: #ffffff; --surface-1: #f5f5f5; --surface-2: #ebebeb;
    --text-primary: #000000; --text-secondary: #262626; --text-disabled: #a3a3a3;
    --border: #d4d4d4; --border-strong: #000000;
    --primary: #000000; --primary-ink: #ffffff; --primary-hover: #1a1a1a; --primary-active: #333333;
    --focus: #000000;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--surface-0); color: var(--text-primary); }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .topo { display: flex; justify-content: flex-end; padding: 16px max(20px, 5vw) 0; }
  .tema-toggle { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px; background: none; color: var(--text-primary); cursor: pointer; }
  .tema-toggle:hover { border-color: var(--border-strong); }
  .tema-toggle svg { width: 18px; height: 18px; }
  .tema-toggle svg[hidden] { display: none; }
  main { max-width: 440px; margin: 0 auto; padding: 32px max(20px, 5vw) 64px; }
  .kicker { margin: 0 0 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-secondary); }
  h1 { margin: 0 0 8px; font-family: 'Unbounded', 'Arial Black', Arial, sans-serif; font-weight: 900; font-size: clamp(22px, 3.5vw, 30px); line-height: 1; letter-spacing: -0.01em; text-transform: uppercase; overflow-wrap: anywhere; }
  .lead { margin: 0 0 32px; color: var(--text-secondary); }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin: 0 0 8px; }
  .campo { display: block; width: 100%; margin: 0 0 20px; padding: 12px 14px; font: inherit; font-size: 17px; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; outline: none; }
  .campo::placeholder { color: var(--text-disabled); }
  .campo:focus-visible { border-color: var(--border-strong); }
  html.theme-light .campo { background: var(--surface-0); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px 24px; border-radius: 8px; border: 1px solid var(--primary); background: var(--primary); color: var(--primary-ink); font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; }
  .btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn:active { background: var(--primary-active); border-color: var(--primary-active); }
  .btn:disabled { background: var(--surface-2); border-color: var(--border); color: var(--text-disabled); cursor: wait; }
  .erro { display: none; align-items: flex-start; gap: 10px; margin: 0 0 20px; padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface-1); font-size: 15px; line-height: 1.5; }
  .erro[data-ativo] { display: flex; }
  .erro svg { flex: none; width: 20px; height: 20px; margin-top: 2px; }
  .erro-rotulo { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  .links { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; font-size: 15px; }
  .links a { color: var(--text-primary); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  ::selection { background: rgba(255, 255, 255, 0.3); }
  html.theme-light ::selection { background: rgba(0, 0, 0, 0.15); }
</style>
<script>
  try {
    var guardado = localStorage.getItem('portal-tema');
    if (guardado === 'claro' || (!guardado && '{{temaPadrao}}' === 'claro')) document.documentElement.classList.add('theme-light');
  } catch (e) {}
</script>
</head>
<body>
<div class="topo">
  <button type="button" class="tema-toggle" id="tema" aria-pressed="false" aria-label="{{t.temaClaro}}" title="{{t.temaClaro}}">
    <svg id="icone-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
    <svg id="icone-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" hidden><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a7 7 0 0 0 9.7 9.7z"/></svg>
  </button>
</div>
<main>
  <p class="kicker">{{organizacao}}</p>
  <h1>{{nome}}</h1>
  <p class="lead">{{t.lead}}</p>
  <form class="card" id="form" novalidate>
    <div class="erro" id="erro" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 L21 19.5 H3 Z"/><line x1="12" y1="10" x2="12" y2="14"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>
      <span><span class="erro-rotulo">Erro</span><span id="erro-texto"></span></span>
    </div>
    <label for="email">{{t.email}}</label>
    <input class="campo" id="email" name="email" type="email" autocomplete="username" required>
    <label for="senha">{{t.senha}}</label>
    <input class="campo" id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button class="btn" id="entrar" type="submit"><span id="entrar-texto">{{t.entrar}}</span><span aria-hidden="true">→</span></button>
  </form>
  <ul class="links">
    <li><a id="esqueci" href="/api/auth/login">{{t.esqueci}}</a></li>
    <li><a id="provedor" href="/api/auth/login">{{t.provedor}}</a></li>
  </ul>
</main>
<script>
  (function () {
    var T = {
      credenciais: '{{t.erroCredenciais}}',
      callback: '{{t.erroCallback}}',
      origem: '{{t.erroOrigem}}',
      nao_configurado: '{{t.erroConfiguracao}}',
      rede: '{{t.erroRede}}',
      entrar: '{{t.entrar}}',
      entrando: '{{t.entrando}}',
      temaClaro: '{{t.temaClaro}}',
      temaEscuro: '{{t.temaEscuro}}'
    };
    var q = new URLSearchParams(location.search);
    // Só caminhos do próprio site: nada de //outro.site nem de esquema.
    var next = q.get('next') || '/';
    if (next.charAt(0) !== '/' || next.indexOf('//') === 0 || next.indexOf('\\') >= 0 || /^\/[^/]*:/.test(next)) next = '/';
    var comNext = '/api/auth/login?next=' + encodeURIComponent(next);
    document.getElementById('esqueci').href = comNext;
    document.getElementById('provedor').href = comNext;

    var erro = document.getElementById('erro');
    var erroTexto = document.getElementById('erro-texto');
    function mostrar(codigo) {
      erroTexto.textContent = T[codigo] || T.rede;
      erro.setAttribute('data-ativo', '');
    }
    if (q.get('erro') === 'callback') mostrar('callback');

    var form = document.getElementById('form');
    var botao = document.getElementById('entrar');
    var botaoTexto = document.getElementById('entrar-texto');
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      erro.removeAttribute('data-ativo');
      botao.disabled = true;
      botaoTexto.textContent = T.entrando;
      fetch('/api/auth/senha', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email: form.email.value.trim(), senha: form.senha.value, next: next })
      })
        .then(function (r) { return r.json().then(function (j) { return { status: r.status, json: j }; }); })
        .then(function (r) {
          if (r.json && r.json.ok) { location.replace(r.json.next || '/'); return; }
          mostrar((r.json && r.json.codigo) || 'rede');
        })
        .catch(function () { mostrar('rede'); })
        .then(function () { botao.disabled = false; botaoTexto.textContent = T.entrar; });
    });

    var toggle = document.getElementById('tema');
    var sol = document.getElementById('icone-sol');
    var lua = document.getElementById('icone-lua');
    function pintar() {
      var claro = document.documentElement.classList.contains('theme-light');
      sol.hidden = claro; lua.hidden = !claro;
      toggle.setAttribute('aria-pressed', claro ? 'true' : 'false');
      toggle.setAttribute('aria-label', claro ? T.temaEscuro : T.temaClaro);
      toggle.title = claro ? T.temaEscuro : T.temaClaro;
    }
    toggle.addEventListener('click', function () {
      var claro = !document.documentElement.classList.contains('theme-light');
      document.documentElement.classList.toggle('theme-light', claro);
      try { localStorage.setItem('portal-tema', claro ? 'claro' : 'escuro'); } catch (e) {}
      pintar();
    });
    pintar();
  })();
</script>
</body>
</html>
